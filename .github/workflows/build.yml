name: Build FansOnly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project FansOnly.xcodeproj \
            -scheme FansOnly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FansOnly.app Payload/
          zip -r FansOnly-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FansOnly-unsigned-ipa
          path: FansOnly-unsigned.ipa
