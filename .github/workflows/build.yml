name: Build FansOnly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project FansOnly.xcodeproj \
            -scheme FansOnly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FansOnly.app Payload/
          zip -r FansOnly-unsigned.ipa Payload

      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | { grep -E '^v0\.1\.[0-9]+-alpha$' || true; } \
            | sed -E 's/^v0\.1\.([0-9]+)-alpha$/\1/' \
            | sort -n | tail -1)
          if [ -z "$LAST" ]; then N=0; else N=$((LAST+1)); fi
          VERSION="0.1.$N"

          RANGE="HEAD"
          if [ -n "$LAST" ] && git rev-parse "v0.1.$LAST-alpha" >/dev/null 2>&1; then
            RANGE="v0.1.$LAST-alpha..HEAD"
          fi
          CHANGES=$(git log $RANGE --no-merges --pretty='- %s (%h)')
          if [ -z "$CHANGES" ]; then CHANGES="- No new commits since the last build"; fi

          {
            echo "Alpha build $VERSION (unsigned .ipa, sign it in Feather)"
            echo
            echo "### Changelog"
            echo "$CHANGES"
          } > notes.md

          cp FansOnly-unsigned.ipa "FansOnly-$VERSION-alpha.ipa"
          gh release create "v$VERSION-alpha" "FansOnly-$VERSION-alpha.ipa" \
            --title "Build $VERSION Alpha" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"
